                  <Hero setPage={setPage} />
                  <LatestCourses setPage={setPage} setLessonId={setLessonId} />
                  <CategoriesSection setPage={setPage} />
                  <PricingSection setPage={setPage} user={user} />
                  <AboutSection />
                  <SupportSection />
                </>
              );
            case "courses":
              return (
                <CoursesPage setPage={setPage} setLessonId={setLessonId} />
              );
            case "lesson":
              return <LessonDetail lessonId={lessonId} setPage={setPage} />;
            case "categories":
              return (
                <div className="pt-24 pb-20">
                  <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="text-center mb-12">
                      <h2 className="text-3xl font-bold mb-2">الأقسام</h2>
                      <p className="text-gray-400">
                        اختر المجال اللي تحب تتعلمه
                      </p>
                    </div>
                    <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {categories.map((cat, i) => (
                        <div
                          key={i}
                          onClick={() => setPage("courses")}
                          className="card-hover group cursor-pointer bg-dark border border-gray-800 rounded-2xl p-8 text-center"
                        >
                          <div
                            className={`w-20 h-20 rounded-2xl bg-gradient-to-br ${cat.color} flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition`}
                          >
                            <i
                              className={`fas ${cat.icon} text-white text-3xl`}
                            ></i>
                          </div>
                          <h3 className="font-bold text-xl mb-2">{cat.name}</h3>
                          <p className="text-gray-500">{cat.count} درس متاح</p>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              );
            case "pricing":
              return (
                <div className="pt-24 pb-20">
                  <PricingSection setPage={setPage} user={user} />
                </div>
              );
            case "about":
              return (
                <div className="pt-24 pb-20">
                  <AboutSection />
                </div>
              );
            case "support":
              return (
                <div className="pt-24 pb-20">
                  <SupportSection />
                </div>
              );
            case "login":
              return <LoginPage login={login} />;
            case "dashboard":
              return user ? (
                <DashboardPage user={user} />
              ) : (
                <LoginPage login={login} />
              );
            case "admin":
              return user && user.role === "admin" ? (
                <AdminPage user={user} />
              ) : (
                <LoginPage login={login} />
              );
            default:
              return (
                <>
                  <Hero setPage={setPage} />
                  <LatestCourses setPage={setPage} setLessonId={setLessonId} />
                  <CategoriesSection setPage={setPage} />
                  <PricingSection setPage={setPage} user={user} />
                  <AboutSection />
                  <SupportSection />
                </>
              );
          }
        };

        return (
          <div className="min-h-screen bg-darker">
            <Navbar
              user={user}
              setPage={setPage}
              logout={logout}
              setLessonId={setLessonId}
              theme={theme}
              toggleTheme={toggleTheme}
            />
            <main>{renderPage()}</main>
            <Footer setPage={setPage} />
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
